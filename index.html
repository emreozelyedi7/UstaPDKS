<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>USTA PDKS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="logo">
                <h2><span style="color: #1A365D;">USTA</span> <span style="color: #F97316;">PDKS</span></h2>
            </div>
            <p>Personel Girişi</p>
            <input type="tel" id="phone-input" placeholder="Telefon Numarası" maxlength="10">
            <input type="password" id="password-input" placeholder="Şifre">
            <button id="login-btn" class="btn-primary">Sisteme Giriş</button>
            <p id="login-error" style="color: red; display: none; margin-top: 10px; font-size: 14px;"></p>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="header">
            <i class="fas fa-bars"></i>
            <h3><span style="color: #1A365D;">USTA</span> <span style="color: #F97316;">PDKS</span></h3>
            <i class="fas fa-bell"></i>
        </div>
        
        <div class="user-info">
            <h4 id="welcome-text">Hoş geldin...</h4>
            <p id="date-text"></p>
            <div id="status-badge" style="margin-top: 10px; display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;"></div>
        </div>

        <div class="action-buttons">
            <button id="btn-giris" class="action-btn enter-btn" style="display: none;">
                <div class="btn-content">
                    <span class="btn-title">MESAİ BAŞLAT</span>
                    <i class="fas fa-sign-in-alt"></i>
                </div>
            </button>
            
            <button id="btn-cikis" class="action-btn exit-btn" style="display: none;">
                <div class="btn-content">
                    <span class="btn-title">MESAİ BİTİR</span>
                    <i class="fas fa-sign-out-alt"></i>
                </div>
            </button>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <h3 id="stat-gecikme">0 dk</h3>
                <p>Bugünkü Gecikme</p>
            </div>
            <div class="stat-card">
                <h3 id="stat-mesai">0 sa</h3>
                <p>Toplam Mesai</p>
            </div>
        </div>

        <button id="logout-btn" class="btn-secondary" style="margin: 20px; width: calc(100% - 40px); background: #999;">Oturumu Kapat</button>
    </div>

    <div id="camera-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center; align-items: center;">
        <button id="cancel-camera-btn" style="position: absolute; top: 40px; left: 20px; padding: 10px 20px; background: rgba(255,255,255,0.2); color: white; border: none; border-radius: 8px; z-index: 10000;">
            <i class="fas fa-times"></i> İptal
        </button>
        <div id="reader" style="width: 100%;"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
