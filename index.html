<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>USTA PDKS - Yönetim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="login-container">
            <h2><span style="color: #1A365D;">USTA</span> <span style="color: #F97316;">PDKS</span></h2>
            <p>Yönetici ve Personel Girişi</p>
            <div style="margin-top: 20px;">
                <input type="tel" id="phone-input" placeholder="Telefon Numarası" maxlength="10">
                <input type="password" id="password-input" placeholder="Şifre">
                <button id="login-btn" class="btn-primary">SİSTEME GİRİŞ</button>
            </div>
        </div>
    </div>

    <div id="dashboard-screen" class="screen">
        <div class="header">
            <h3>USTA PDKS</h3>
            <button id="admin-entry-btn" style="display: none; background: #1A365D; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 12px;">Yönetici Paneli</button>
        </div>
        
        <div class="user-info">
            <h4 id="welcome-text">Hoş geldin...</h4>
            <div id="status-badge" style="margin-top: 10px; display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;">Kontrol ediliyor...</div>
        </div>

        <div class="action-buttons">
            <button id="btn-giris" class="action-btn enter-btn" style="display: none;">
                <div class="btn-content"><span>MESAİ BAŞLAT</span><i class="fas fa-sign-in-alt"></i></div>
            </button>
            <button id="btn-cikis" class="action-btn exit-btn" style="display: none;">
                <div class="btn-content"><span>MESAİ BİTİR</span><i class="fas fa-sign-out-alt"></i></div>
            </button>
        </div>

        <button id="logout-btn" class="btn-secondary" style="margin: 20px; width: calc(100% - 40px); background: #666;">Çıkış Yap</button>
    </div>

    <div id="manager-screen" class="screen">
        <div class="header">
            <button id="back-to-dash" style="background: none; border: none; font-size: 20px;"><i class="fas fa-arrow-left"></i></button>
            <h3>Giriş-Çıkış Raporları</h3>
        </div>
        <div style="padding: 15px;">
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">* Mesai Başlangıcı: 09:00</p>
            <div id="report-list" style="display: flex; flex-direction: column; gap: 10px;">
                <p>Yükleniyor...</p>
            </div>
        </div>
    </div>

    <div id="camera-screen" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; justify-content: center;">
        <button id="cancel-camera-btn" style="position: absolute; top: 40px; left: 20px; padding: 10px; background: rgba(255,255,255,0.2); color: white; border: 1px solid white; border-radius: 5px;">İptal</button>
        <div id="reader" style="width: 100%;"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
